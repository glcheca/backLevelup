spring:
  application:
    name: levelup
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/levelup}
    username: ${DB_USER:levelup}
    password: ${DB_PASSWORD:levelup}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  auth:
    cookie-secure: ${COOKIE_SECURE:false}
  reminders:
    poll-interval-ms: ${REMINDER_POLL_INTERVAL_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
