spring:
  datasource:
    url: jdbc:h2:mem:levelup-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-with-at-least-32-characters-long
    access-ttl: PT15M
    refresh-ttl: P7D
  auth:
    cookie-secure: false
  cors:
    allowed-origins: http://localhost:5173
  rate-limit:
    enabled: false
