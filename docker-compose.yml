services:
  db:
    image: postgres:17-alpine
    container_name: levelup-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-levelup}
      POSTGRES_USER: ${POSTGRES_USER:-levelup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-levelup}
    ports:
      - "5432:5432"
    volumes:
      - levelup_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-levelup} -d ${POSTGRES_DB:-levelup}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  levelup_pgdata:
